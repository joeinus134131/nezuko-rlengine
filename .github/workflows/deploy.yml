name: Deploy Finance Dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: finance-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/finance_deploy"
          chmod 600 "$HOME/.ssh/finance_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Pull, rebuild, and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        run: |
          ssh \
            -i "$HOME/.ssh/finance_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<REMOTE
          set -euo pipefail

          cd /home/ubuntu/nezuko-rlengine
          git fetch origin main
          git checkout -f main
          git reset --hard origin/main

          # Write .env from GitHub Secrets if provided, otherwise preserve existing VPS .env.
          if [ -n "${DATABASE_URL}" ]; then
            cat > .env <<ENVEOF
DATABASE_URL=${DATABASE_URL}
APP_SECRET_KEY=${APP_SECRET_KEY}
ENVEOF
            chmod 600 .env
          elif [ ! -f .env ]; then
            touch .env
            chmod 600 .env
          fi

          if [ -f .env ]; then
            set -a
            . ./.env
            set +a
          fi

          sudo -E docker compose -f deploy/compose.yaml build
          sudo -E docker compose -f deploy/compose.yaml up -d --remove-orphans

          echo "== running Postgres migrations (auto on push) =="
          sudo docker exec nezuko-finance python scripts/migrate_db.py
          echo "== verifying migration =="
          sudo docker exec nezuko-finance python -c "from finrl.db.database import is_db_configured, get_engine; from sqlalchemy import text; (print('DB verified, alembic version count:', get_engine().connect().execute(text('select count(*) from alembic_version')).scalar()) if is_db_configured() else print('Mode file lokal, skip verification.'))"

          for attempt in $(seq 1 36); do
            status="$(sudo docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' nezuko-finance 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              sudo docker logs --tail 150 nezuko-finance
              exit 1
            fi
            sleep 5
          done

          test "$(sudo docker inspect --format='{{.State.Health.Status}}' nezuko-finance)" = "healthy"
          curl --fail --silent --show-error --max-time 20 \
            https://finance.idnmakerspace.com/_stcore/health
          REMOTE
